{% from "macros.html" import how %}
<div class="answer answer-{{ answer.kind.value }}">
  <p class="answer-q">{{ question }}</p>
  <p class="answer-text">{{ answer.text }}</p>
  {% if provenance.fallback %}<p class="std-label">Standard answer (not AI-generated).</p>{% endif %}
  {% if cited %}
  <ul class="answer-facts">
    {% for fact in cited %}<li><span class="kind kind-{{ fact.kind.name|lower }}">{{ kind_labels[fact.kind] }}</span> {{ fact.text }}</li>{% endfor %}
  </ul>
  {% endif %}
  {{ how(provenance) }}
</div>
