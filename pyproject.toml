[project]
name = "nirmal-air"
version = "0.1.0"
description = "GenAI clean-air assistant for Indian families: measured air, a personal daily plan and the impact of each choice."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "playwright>=1.65.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "S",        # bandit (security)
  "SIM",      # simplify
  "C4",       # comprehensions
  "C90",      # mccabe complexity
  "RET",      # return
  "PTH",      # pathlib
  "D",        # docstrings
  "ANN",      # annotations
  "PL",       # pylint
  "RUF",      # ruff-specific
]
ignore = ["D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
pythonpath = ["."]
# Browser tests need Playwright's Chromium: run them with `pytest -m e2e`.
addopts = '-q --strict-markers --doctest-modules -m "not e2e"'
markers = ["e2e: real-browser tests against a running app (Playwright)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/index.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.vercel]
entrypoint = "app.index:app"
